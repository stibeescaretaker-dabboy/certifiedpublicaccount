<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='black'/><text x='16' y='23' font-size='17' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>SG</text></svg>">
  <link rel="stylesheet" href="{{ 'assets/css/style.css' | relative_url }}">
</head>
<body data-root="{{ '' | relative_url }}">
  <div id="world">
    <div id="bg-gradient"></div>
    <div id="bg-tile"></div>
    <div id="floaters" aria-hidden="true"></div>
{{ content }}
  </div>
  <noscript>
    <style>
      html, body { overflow: auto; }
      #world { position: static; width: auto; height: auto; transform: none !important; }
      #bg-gradient, #bg-tile, #floaters { display: none; }
      #column { position: static; margin: 0 auto; }
    </style>
  </noscript>
  <script src="{{ 'assets/js/panzoom.js' | relative_url }}"></script>
</body>
</html>
